[env:linux]
extends = linux_base
build_flags = ${linux_base.build_flags}
  !pkg-config --cflags --libs libbsd-overlay --silence-errors || :

[env:linux_repeater]
extra_scripts = pre:scripts/patch_busio.py
extends = linux_base
lib_ignore =
  Adafruit seesaw Library
build_flags =
  ${linux_base.build_flags}
  -D RADIO_CLASS=LinuxSX1262
  -D WRAPPER_CLASS=LinuxSX1262Wrapper
  -D USE_CUSTOM_SX1262_WRAPPER
  -D SKIP_CONFIG_OVERWRITE=1
  -D MAX_NEIGHBOURS=100
  -D LORA_TX_POWER=22
  -D MESH_DEBUG=1
  -D WITH_TCP_COMPANION=1
  -D TCP_COMPANION_PORT=5000
  -D WITH_MC_CONSOLE=1
  -D MC_CONSOLE_INSTANCE='"default"'
;  -D ENV_INCLUDE_GPS=1
;  -D GPS_SERIAL_DEVICE='"/dev/serial0"'
;  -D GPS_BAUD_RATE=9600

build_src_filter = ${linux_base.build_src_filter}
  +<../examples/simple_repeater>
  -<helpers/sensors/EnvironmentSensorManager.cpp>
  +<helpers/linux/LinuxTCPCompanionInterface.cpp>
  +<helpers/linux/LinuxConsoleServer.cpp>

lib_deps =
  ${linux_base.lib_deps}
;  stevemarple/MicroNMEA @ ^2.0.6


; Linux repeater with MQTT bridge over the host's existing wired Ethernet
; connection (no WiFi). Talks to the broker using a built-in minimal MQTT
; client over a plain POSIX TCP socket — point WITH_MQTT_BRIDGE_SERVER at
; your broker's LAN IP/hostname (and a local stunnel/socat if TLS is
; required, since the built-in client is plaintext-only).
;
; Runtime overrides (no rebuild needed) via CLI:
;   set bridge.mqtt.server 192.168.1.50
;   set bridge.mqtt.port 1883
;   set bridge.mqtt.topic meshcore/bridge
;   set bridge.mqtt.user myusername
;   set bridge.mqtt.pass mypassword
;   set bridge.autostart 1
;   bridge start
;   bridge stop
;   get bridge.status
;
; GPS settings: 
;     device must be in NMEA human-readable format.
;     UBX binary is not supported.
;     meshcore user has to be in dialout group to be able read gps data.

[env:linux_repeater_mqtt]
extra_scripts = pre:scripts/patch_busio.py
extends = linux_base
lib_ignore =
  Adafruit seesaw Library
build_flags =
  ${linux_base.build_flags}
  -D RADIO_CLASS=LinuxSX1262
  -D WRAPPER_CLASS=LinuxSX1262Wrapper
  -D USE_CUSTOM_SX1262_WRAPPER
  -D SKIP_CONFIG_OVERWRITE=1
  -D MAX_NEIGHBOURS=300
  -D LORA_TX_POWER=22
  -D MESH_DEBUG=1
  -D WITH_MQTT_BRIDGE=1
  -D WITH_MQTT_BRIDGE_SERVER='""'
  -D WITH_MQTT_BRIDGE_PORT=1883
  -D WITH_MQTT_BRIDGE_TOPIC='"meshcore/bridge"'
  -D WITH_MQTT_BRIDGE_USER='""'
  -D WITH_MQTT_BRIDGE_PASS='""'
  -D BRIDGE_DEBUG=1
  -D WITH_SNMP=1
  -D SNMP_PORT=161
  -D SNMP_COMMUNITY='"public"'
  -D SNMP_VERSION=2
  -D WITH_TCP_COMPANION=1
  -D TCP_COMPANION_PORT=5000
  -D WITH_MC_CONSOLE=1
  -D MC_CONSOLE_INSTANCE='"default"'
;  -D ENV_INCLUDE_GPS=1
;  -D GPS_SERIAL_DEVICE='"/dev/serial0"'
;  -D GPS_BAUD_RATE=9600
;  -D ARDUINO_ARCH_MBED

build_src_filter = ${linux_base.build_src_filter}
  +<../examples/simple_repeater>
  +<helpers/bridges/MQTTBridge.cpp>
  +<helpers/snmp/SNMPAgent.cpp>
  -<helpers/sensors/EnvironmentSensorManager.cpp>
  +<helpers/linux/LinuxTCPCompanionInterface.cpp>
  +<helpers/linux/LinuxConsoleServer.cpp>

lib_deps =
  ${linux_base.lib_deps}
;  stevemarple/MicroNMEA @ ^2.0.6

; =============================================================================
; linux_room_mqtt_only — MQTT-only room server.
;
;   This node NEVER opens /dev/spidevX.Y and NEVER claims any LoRa GPIO
;   line (RADIO_NONE=1 swaps in NullRadio — see
;   src/helpers/radiolib/NullRadio.h). All packet I/O is via MQTTBridge:
;
;     - inbound:  MQTT -> _mgr->queueInbound() (normal RX path)
;     - outbound: MyMesh::logTx/logRx -> bridge.sendPacket() -> MQTT
;
;   Pair this with a linux_repeater_mqtt (or linux_room_mqtt) node that DOES
;   own the radio and publishes/subscribes on the SAME bridge.mqtt.topic.
;   That node sees real LoRa traffic; this node only sees what arrives via
;   the broker — so two processes can cooperate over one physical radio
;   without any SPI/GPIO contention, since this process never touches the
;   chip at all.
;
;   Runtime CLI commands (same as linux_room_mqtt):
;     set bridge.mqtt.server  192.168.1.50
;     set bridge.mqtt.port    1883
;     set bridge.mqtt.topic   meshcore/room
;     set bridge.mqtt.user    myuser
;     set bridge.mqtt.pass    mypass
;     set bridge.autostart    1
;     bridge start / bridge stop / get bridge.status
; =============================================================================
[env:linux_room_mqtt_only]
extends = linux_base
extra_scripts = pre:scripts/patch_busio.py
lib_ignore =
  Adafruit seesaw Library
build_flags =
  ${linux_base.build_flags}
  -D RADIO_NONE=1
  -D SKIP_CONFIG_OVERWRITE=1
  -D MESH_DEBUG=1
  -D WITH_MQTT_BRIDGE=1
  -D WITH_MQTT_BRIDGE_SERVER='"127.0.0.1"'
  -D WITH_MQTT_BRIDGE_PORT=1883
  -D WITH_MQTT_BRIDGE_TOPIC='"meshcore/room"'
  -D WITH_MQTT_BRIDGE_USER='"meshcore-room-server-1"'
  -D WITH_MQTT_BRIDGE_PASS='""'
  -D BRIDGE_DEBUG=1
  -D WITH_TCP_COMPANION=1
  -D TCP_COMPANION_PORT=5000
  -D WITH_MC_CONSOLE=1
  -D MC_CONSOLE_INSTANCE='"default"'
build_src_filter =
  ${linux_base.build_src_filter}
  +<../examples/simple_room_server_mqtt_only>
  +<helpers/bridges/MQTTBridge.cpp>
  +<helpers/linux/LinuxTCPCompanionInterface.cpp>
  +<helpers/linux/LinuxConsoleServer.cpp>
lib_deps =
  ${linux_base.lib_deps}
